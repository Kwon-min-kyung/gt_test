<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sayonara Tender</title>

    <style>
        /* 폰트 */
        @font-face {
            font-family: 'Kiribari';
            src: url('./Kiribari-Koma2.ttf') format('truetype');
        }

        @font-face {
            font-family: 'KazukiReiwa';
            src: url('./KazukiReiwa - Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'JejuMyeongjo';
            src: url('./JejuMyeongjoOTF.otf') format('opentype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 공통 화면 설정 */
        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* 첫 번째 화면 */
        .first-screen {
            background-image: url('./back.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            isolation: isolate;
            opacity: 1;
            transition: opacity 0.8s ease;
            z-index: 3;
        }

        /* 호버용 두 번째 배경 */
        .first-screen::before {
            content: '';
            position: absolute;
            inset: 0;

            background-image: url('./back2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        /* 타이틀 호버 시 배경 전환 */
        .first-screen:has(.title:hover)::before {
            opacity: 1;
        }

        /* 메인 타이틀 */
        .title {
            position: absolute;
            left: 4%;
            bottom: 13%;
            width: 65%;
            z-index: 1;

            font-family: 'Kiribari', sans-serif;
            font-size: 150px;
            font-weight: normal;
            line-height: 1.05;
            letter-spacing: -5px;
            color: #ffffff;

            mix-blend-mode: difference;
            cursor: pointer;
        }

        .title-line {
            display: block;
            white-space: nowrap;
        }

        .title-line.second {
            margin-left: 32%;
            margin-top: -0.02em;
        }

        /* 한글 텍스트 */
        .korean {
            position: absolute;
            z-index: 1;

            font-family: 'JejuMyeongjo', serif;
            font-weight: normal;
            color: #ffffff;

            mix-blend-mode: difference;
            pointer-events: none;
        }

        /* 한글 불규칙 배치 */
        .kr-an {
            font-size: 45px;
            left: 11%;
            top: 73%;
            transform: rotate(-8deg);
        }

        .kr-nyeong {
            font-size: 30px;
            left: 17%;
            top: 75%;
            transform: rotate(20deg);
        }

        .kr-ten {
            font-size: 25px;
            left: 41%;
            top: 89%;
            transform: rotate(-16deg);
        }

        .kr-deo {
            font-size: 40px;
            left: 46%;
            top: 86%;
            transform: rotate(9deg);
        }

        /* 우측 하단 아티스트명 */
        .artist {
            position: absolute;
            right: 3.5%;
            bottom: 5%;
            z-index: 1;

            font-family: 'Kiribari', sans-serif;
            font-size: 50px;
            font-weight: normal;
            letter-spacing: -3px;
            color: #ffffff;
            white-space: nowrap;

            mix-blend-mode: difference;
        }

        /* 두 번째 화면 - 영상 */
        .second-screen {
            background-color: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 1;
            transition: opacity 1.2s ease;
            z-index: 2;

            cursor: pointer;
            overflow: hidden;
        }

        /* 영상과 컬러 필터를 묶는 영역 */
        .video-container {
            position: relative;

            width: 60%;
            max-height: 85vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 영상 크기 및 비율 */
        .video-container video {
            width: 100%;
            height: auto;
            max-height: 85vh;

            object-fit: contain;
            display: block;
        }

        /* 영상 영역에만 적용되는 컬러 필터 */
        .color-overlay {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-color: transparent;

            pointer-events: none;

            /* 클릭 시 빠른 색상 전환 */
            transition: background-color 0.12s linear;
        }

        /* 영상 영역을 크게 채우는 코멘트 (그림자 없음) */
        .video-comment {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5%;
            pointer-events: none;
            color: #ffffff;
            font-family: 'JejuMyeongjo', serif;
            text-align: center;
            opacity: 0;
            overflow: hidden;
        }

        .video-comment-content {
            display: block;
            width: 100%;
            font-size: 24px; /* 실제 크기는 문장별로 자동 계산 */
            line-height: 1.12;
            letter-spacing: -0.035em;
            white-space: pre-line;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-shadow: none;
        }

        /* 일본어 코멘트만 별도 폰트 */
        .video-comment.japanese {
            font-family: 'KazukiReiwa', sans-serif;
        }

        .video-comment.show {
            opacity: 1;
        }

        /* 영상 상단 안내 문구 */
        .video-instruction {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);

            z-index: 3;

            font-family: 'JejuMyeongjo', serif;
            font-size: 22px;
            font-weight: normal;
            letter-spacing: -1px;

            color: #ffffff;
            text-align: center;
            white-space: nowrap;

            /* 처음에는 숨김 */
            display: none;
            pointer-events: none;
        }

        /* 16초 후 안내 문구 표시 */
        .video-instruction.show {
            display: block;
        }

        /* 세 번째 화면 - 흰색 배경 */
        .third-screen {
            background-color: #ffffff;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 세 번째 화면 텍스트 공통 */
        .ending-text {
            display: none;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-family: 'Kiribari', sans-serif;
            font-weight: normal;
            color: #000000;
            text-align: center;
            white-space: nowrap;
        }

        /* 일본어 메인 문구 */
        .ending-main {
            display: block;
        }

        /* 첫 번째 문구 */
        .ending-intro {
            font-size: 55px;
            letter-spacing: -2px;
        }

        /* 두 번째 타이틀 */
        .ending-title {
            font-size: 75px;
            letter-spacing: -3px;
        }

        /* 세 번째 아티스트명 */
        .ending-artist {
            font-size: 55px;
            letter-spacing: -2px;
        }

        /* 한글 자막 */
        .ending-subtitle {
            display: block;
            margin-top: 18px;

            font-family: 'JejuMyeongjo', serif;
            font-size: 22px;
            font-weight: normal;
            letter-spacing: -1px;
            line-height: 1.4;

            color: #000000;
            text-align: center;
        }

        /* 페이드 없이 즉시 표시 */
        .ending-text.show {
            display: block;
        }

        /* 화면 페이드아웃 */
        .first-screen.hidden,
        .second-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 모바일 */
        @media (max-width: 768px) {
            .title {
                left: 5%;
                bottom: 25%;
                width: 90%;
                font-size: 11vw;
            }

            .title-line.second {
                margin-left: 20%;
            }

            .korean {
                font-size: 3.5vw;
            }

            .kr-an {
                left: 15%;
                top: 56%;
                font-size: 5vw;
            }

            .kr-nyeong {
                left: 25%;
                top: 62%;
            }

            .kr-ten {
                left: 48%;
                top: 76%;
            }

            .kr-deo {
                left: 58%;
                top: 73%;
            }

            .artist {
                right: 5%;
                bottom: 5%;
                font-size: 4vw;
            }

            .video-container {
                width: 90%;
                max-height: 80vh;
            }

            .video-container video {
                max-height: 80vh;
            }

            .video-instruction {
                top: 7%;
                font-size: 3.5vw;
            }

            .video-comment {
                padding: 3%;
            }

            .ending-intro {
                font-size: 7vw;
            }

            .ending-title {
                font-size: 8vw;
            }

            .ending-artist {
                font-size: 6vw;
            }

            .ending-subtitle {
                font-size: 3.5vw;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- 첫 번째 화면 -->
    <div class="screen first-screen" id="firstScreen">

        <!-- 메인 타이틀 -->
        <div class="title" id="title">
            <span class="title-line">さよなら</span>
            <span class="title-line second">テンダー</span>
        </div>

        <!-- 한글 텍스트 -->
        <span class="korean kr-an">안</span>
        <span class="korean kr-nyeong">녕</span>
        <span class="korean kr-ten">텐</span>
        <span class="korean kr-deo">더</span>

        <!-- 아티스트명 -->
        <div class="artist">
            koyori, 初音ミク
        </div>

    </div>

    <!-- 두 번째 화면: 영상 -->
    <div class="screen second-screen" id="secondScreen">

        <!-- 영상과 컬러 필터 영역 -->
        <div class="video-container">

            <!-- 영상 -->
            <video id="mainVideo" playsinline muted preload="auto">
                <source src="./22.MOV">
                브라우저가 영상을 지원하지 않습니다.
            </video>

            <!-- 영상 위 컬러 필터 -->
            <div class="color-overlay" id="colorOverlay"></div>

            <!-- 클릭 시 색상과 함께 바뀌는 문장 -->
            <div class="video-comment" id="videoComment" aria-live="off">
                <span class="video-comment-content" id="videoCommentContent"></span>
            </div>

        </div>

        <!-- 상단 안내 문구 -->
        <div class="video-instruction" id="videoInstruction">
            [ 비트에 맞게 화면을 클릭해 보세요 ]
        </div>

    </div>

    <!-- 세 번째 화면: 엔딩 -->
    <div class="screen third-screen" id="thirdScreen">

        <!-- 첫 번째 문구 -->
        <div class="ending-text ending-intro" id="endingIntro">
            <span class="ending-main">この曲は</span>
            <span class="ending-subtitle">[이 곡은]</span>
        </div>

        <!-- 두 번째 문구 -->
        <div class="ending-text ending-title" id="endingTitle">
            <span class="ending-main">さよならテンダー</span>
            <span class="ending-subtitle">[안녕 텐더]</span>
        </div>

        <!-- 세 번째 문구 -->
        <div class="ending-text ending-artist" id="endingArtist">
            <span class="ending-main">By. koyori, 初音ミク</span>
        </div>

    </div>

    <!-- 모든 화면에서 유지되는 배경음악 -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="./v.mp3" type="audio/mpeg">
    </audio>

    <script>
        const title = document.getElementById('title');
        const firstScreen = document.getElementById('firstScreen');
        const secondScreen = document.getElementById('secondScreen');

        const mainVideo = document.getElementById('mainVideo');
        const bgMusic = document.getElementById('bgMusic');

        const colorOverlay = document.getElementById('colorOverlay');
        const videoComment = document.getElementById('videoComment');
        const videoCommentContent = document.getElementById('videoCommentContent');
        const videoInstruction = document.getElementById('videoInstruction');

        const endingIntro = document.getElementById('endingIntro');
        const endingTitle = document.getElementById('endingTitle');
        const endingArtist = document.getElementById('endingArtist');

        let started = false;
        let videoEnded = false;

        /* 컬러 필터 목록 */
        const colors = [
            'rgba(255, 0, 0, 0.35)',
            'rgba(0, 100, 255, 0.35)',
            'rgba(0, 255, 100, 0.35)',
            'rgba(180, 0, 255, 0.35)',
            'rgba(255, 230, 0, 0.35)',
            'rgba(255, 0, 150, 0.35)',
            'rgba(0, 255, 255, 0.35)',
            'rgba(255, 130, 0, 0.35)'
        ];

        /* 컬러 필터와 1:1로 대응되는 8개의 문장 */
        const comments = [
            `70～80年代のブルース感が半端ねえ　まさかボカロでこういう曲聞けるとは思わんかったよね
エンヴィーとか曖昧劣情Loverとか未来景イノセンスの時点でこのPはすげぇと思ってたけどここまで多彩とは`,
            `どのボカロにもない愛憎がじわじわと染み込んでくるこの感じ好きすぎる`,
            `Damn, I hate when awesome songs don't have the exposure they deserve. At least it came to me now.`,
            `この、学校の帰り道みたいな背景クッソ好き
ため息とかつきながら帰ってそう`,
            `夕方の赤い空が暗くなって、紫に近い感じになる一瞬の怪しい雰囲気と、ほのかなノスタルジックさを感じさせる曲が電ポルｐさんの持ち味だと思う！
つまりこの曲は最高。`,
            `Still very good in 2026, 7 years later!`,
            `인정이지`,
            `この雰囲気マジ好き♡T^T♡`
        ];

        let colorIndex = 0;

        /* 문장 길이에 따라 영상 너비와 높이를 최대한 채우도록 글자 크기 자동 조정 */
        function fitVideoComment() {
            if (!videoComment.classList.contains('show')) return;

            const area = videoComment.getBoundingClientRect();
            const style = getComputedStyle(videoComment);
            const availableWidth = area.width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            const availableHeight = area.height - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            if (availableWidth <= 0 || availableHeight <= 0) return;

            let low = 8;
            let high = Math.max(40, availableWidth * 0.5);

            // 너무 긴 코멘트는 줄바꿈해 수용하고, 짧은 코멘트는 크게 확장
            for (let i = 0; i < 16; i++) {
                const middle = (low + high) / 2;
                videoCommentContent.style.fontSize = middle + 'px';
                if (videoCommentContent.scrollHeight <= availableHeight * 0.94 &&
                    videoCommentContent.scrollWidth <= availableWidth + 1) {
                    low = middle;
                } else {
                    high = middle;
                }
            }
            videoCommentContent.style.fontSize = low + 'px';
        }

        window.addEventListener('resize', fitVideoComment);
        mainVideo.addEventListener('loadedmetadata', fitVideoComment);
        document.fonts.ready.then(fitVideoComment);

        /* 타이틀 클릭 시 영상과 음악 재생 */
        title.addEventListener('click', function() {

            if (started) return;
            started = true;

            /* 첫 번째 화면 페이드아웃 */
            firstScreen.classList.add('hidden');

            /* 영상과 음악 처음부터 재생 */
            mainVideo.currentTime = 0;
            bgMusic.currentTime = 0;

            mainVideo.muted = true;

            mainVideo.play().catch(error => {
                console.error('영상 재생 실패:', error);
            });

            bgMusic.play().catch(error => {
                console.error('음악 재생 실패:', error);
            });

        });

        /* 영상이 16초 지점에 도달하면 안내 문구 표시 */
        mainVideo.addEventListener('timeupdate', function() {

            if (!videoEnded && mainVideo.currentTime >= 16) {
                videoInstruction.classList.add('show');
            }

        });

        /* 두 번째 화면 클릭 시 컬러 필터 변경 */
        secondScreen.addEventListener('click', function() {

            if (!started || videoEnded) return;

            /* 같은 번호의 색상과 문장을 동시에 표시 */
            colorOverlay.style.backgroundColor = colors[colorIndex];
            videoCommentContent.textContent = comments[colorIndex];
            /* 일본어: 1, 2, 4, 5, 8번째 / 영어·한국어: JejuMyeongjo */
            videoComment.classList.toggle(
    'japanese',
    [0, 1, 2, 3, 4, 5, 7].includes(colorIndex)
);
            videoComment.classList.add('show');
            fitVideoComment();

            /* 다음 색상으로 이동 */
            colorIndex = (colorIndex + 1) % colors.length;

        });

        /* 영상 종료 후 세 번째 화면 */
        mainVideo.addEventListener('ended', function() {

            videoEnded = true;

            /* 안내 문구 숨기기 */
            videoInstruction.classList.remove('show');
            videoComment.classList.remove('show');

            /* 검은 화면 페이드아웃 */
            secondScreen.classList.add('hidden');

            /* 1.2초 페이드 완료 후 문구 순차 표시 */
            setTimeout(function() {

                /* 1. この曲は + [이 곡은] */
                endingIntro.classList.add('show');

                setTimeout(function() {

                    endingIntro.classList.remove('show');

                    /* 2. さよならテンダー + [굿바이 텐더] */
                    endingTitle.classList.add('show');

                    setTimeout(function() {

                        endingTitle.classList.remove('show');

                        /* 3. By. koyori, 初音ミク */
                        endingArtist.classList.add('show');

                        setTimeout(function() {

                            endingArtist.classList.remove('show');

                        }, 1000);

                    }, 1000);

                }, 1000);

            }, 1200);

            /* 배경음악은 계속 재생 */

        });
    </script>

</body>
</html>
