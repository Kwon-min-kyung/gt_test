<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>さよなら、テンダー — Visual Collage</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { display: flex; justify-content: center; align-items: flex-start; }
    /* 580 × 2048 원본 시안의 좌표를 퍼센트로 변환한 반응형 아트보드 */
    .slide { position: relative; width: min(100%, 580px); aspect-ratio: 580 / 2048; background: #fff; overflow: hidden; container-type: inline-size; isolation: isolate; }
    .art { position: absolute; display: block; object-fit: fill; max-width: none; user-select: none; pointer-events: none; }
    .text { position: absolute; margin: 0; line-height: 1; white-space: nowrap; color: #050505; font-family: 'Noto Sans JP', 'Noto Sans KR', sans-serif; }
    .note { position: absolute; margin: 0; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; font-size: 1.35cqw; line-height: 1.25; color: #171717; }
    .bg { top: 0; left: 0; width: 100%; height: auto; z-index: 0; }
    /* 헤더의 낱장 종이처럼 기울어진 글자 */
    .cutout { position: absolute; display: inline-flex; align-items: center; justify-content: center; color: #000; background: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; line-height: .95; box-shadow: 0 0 .1cqw rgba(0,0,0,.18); }
    .heading-a { left: 4.0%; top: 7.5%; width: 10%; height: 3.7%; font-size: 8.1cqw; transform: rotate(-10deg); }
    .heading-b { left: 15.9%; top: 7.7%; width: 10.1%; height: 3.9%; font-size: 8.0cqw; transform: rotate(5deg); }
    .heading-c { left: 27%; top: 7.6%; width: 10.4%; height: 4.2%; font-size: 7.7cqw; transform: rotate(-13deg); }
    .heading-d { left: 39%; top: 7.5%; width: 9.8%; height: 3.9%; font-size: 8.1cqw; transform: rotate(4deg); }
    .heading-e { left: 24.8%; top: 10.9%; width: 11.6%; height: 3.1%; font-size: 8.1cqw; transform: rotate(6deg); }
    .heading-f { left: 35.4%; top: 10.8%; width: 11.8%; height: 3.1%; font-size: 8.0cqw; transform: rotate(-7deg); }
    .heading-g { left: 47.1%; top: 10.1%; width: 9.8%; height: 3.2%; font-size: 8.3cqw; transform: rotate(-9deg); }
    .heading-h { left: 55.9%; top: 10.1%; width: 9.8%; height: 3.0%; font-size: 8cqw; transform: rotate(6deg); }
    .small-hi { left: 15.1%; top: 10.65%; font-size: 1.5cqw; color: #fff; }
    .small-ten { left: 37.5%; top: 13.25%; font-size: 1.7cqw; color: #fff; }
    .small-der { left: 44.4%; top: 13.08%; font-size: 1.7cqw; color: #fff; }
    .credit { left: 64%; top: 13.52%; color: #fff; font-size: 3cqw; font-weight: 800; letter-spacing: -.07em; transform: rotate(3deg); }
    /* 중앙 콜라주 */
    .burn { left: -3.5%; top: 39.7%; width: 19%; height: 13.4%; z-index: 1; }
    .bow { left: 33.1%; top: 33.9%; width: 17%; height: 12.1%; z-index: 2; }
    .charcoal { left: 5.5%; top: 38.4%; font-size: 7.7cqw; font-weight: 900; transform: rotate(-8deg); z-index: 3; letter-spacing: -.04em; }
    .charcoal span { display: inline-block; padding: .06em .13em; background: #000; color: #fff; margin-right: .05em; }
    .charcoal .tail { color: #000; background: transparent; padding-left: 0; }
    .thanks { left: 17.1%; top: 41.2%; font-size: 3.25cqw; font-family: Georgia, serif; z-index: 3; }
    .inside { left: 66%; top: 41.1%; font-size: 5.4cqw; font-weight: 900; z-index: 3; }
    .wipe { left: 69.3%; top: 42.5%; font-size: 8.2cqw; font-weight: 900; z-index: 3; }
    .wipe .blk { display: inline-block; padding: .04em .1em; color: #fff; background: #000; }
    .mouth { left: 53.5%; top: 44.35%; width: 21%; height: 8.95%; z-index: 1; }
    .clean { left: 82.5%; top: 48.95%; width: 14.5%; height: 6.95%; z-index: 1; }
    .cross { left: 66.8%; top: 49.0%; width: 32%; height: 7.8%; z-index: 4; }
    .note-thanks { left: 5.3%; top: 37.6%; }
    .note-wipe { left: 53.5%; top: 43.6%; }
    /* 하단 대화 장면 */
    .kid { left: 3.7%; top: 62.65%; width: 47.6%; height: 8.0%; z-index: 1; }
    .brain { left: 6.9%; top: 62.05%; width: 12%; height: 4.0%; z-index: 2; }
    .censor { position: absolute; top: 64.4%; left: 21.1%; width: 13.4%; height: .7%; background: #000; z-index: 3; }
    .quote { left: 41.3%; top: 64.95%; font-weight: 900; font-size: 5.1cqw; letter-spacing: -.085em; }
    .quote-note { left: 64.2%; top: 66.55%; font-size: 1.1cqw; }
    .finger { left: 80%; top: 72.8%; width: 17.6%; height: 4.9%; }
    .finger-note { left: 78%; top: 77.45%; font-size: 1.05cqw; }
    .finger-caption { left: 77%; top: 78.6%; font-size: 3.0cqw; font-family: Georgia, 'Noto Sans JP', serif; }
    @media (prefers-reduced-motion: no-preference) { .slide { scroll-margin-top: 0; } }
  </style>
</head>
<body>
  <main class="slide" aria-label="さよなら、テンダー 디자인 콜라주">
    <img class="art bg" src="img/bg.png" alt="전봇대와 거리의 흑백 하프톤 배경" />
    <span class="cutout heading-a">さ</span>
    <span class="cutout heading-b">よ</span>
    <span class="cutout heading-c">な</span>
    <span class="cutout heading-d">ら</span>
    <span class="cutout heading-e">テ</span>
    <span class="cutout heading-f">ン</span>
    <span class="cutout heading-g">ダ</span>
    <span class="cutout heading-h">ー</span>
    <span class="text small-hi">안　녕</span>
    <span class="text small-ten">텐</span>
    <span class="text small-der">더</span>
    <span class="text credit">koyori, 初音ミク</span>

    <p class="note note-thanks">그을려버린 “고마워”,</p>
    <img class="art burn" src="img/burn.png" alt="그을린 종이의 가장자리" />
    <p class="text charcoal"><span>煤</span><span>け</span><span class="tail">た</span></p>
    <img class="art bow" src="img/bow.png" alt="고개 숙여 인사하는 사람의 실루엣" />
    <p class="text thanks">ありがとう</p>
    <p class="text inside">中身を</p>
    <p class="text wipe"><span class="blk">拭</span>えない</p>
    <p class="note note-wipe">속까지 닦아낼 순 없어</p>
    <img class="art mouth" src="img/mouth.png" alt="입속에 이어진 길의 흑백 콜라주" />
    <img class="art clean" src="img/clean.png" alt="바닥을 닦는 인물" />
    <img class="art cross" src="img/x.png" alt="빨간 X 표시" />

    <img class="art kid" src="img/kid.png" alt="마주 보고 이야기하는 두 사람의 일러스트" />
    <img class="art brain" src="img/brain.png" alt="분홍색 뇌" />
    <div class="censor" aria-hidden="true"></div>
    <p class="text quote">“私頭悪いのよ”</p>
    <p class="note quote-note">“난 머리가 나빠”</p>
    <img class="art finger" src="img/finger.png" alt="앞을 가리키는 손" />
    <p class="note finger-note">그건 네가 늘 하던 말이었지</p>
    <p class="text finger-caption">君の常套句さ。</p>
  </main>
</body>
</html>
